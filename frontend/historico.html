<!DOCTYPE html>
<html lang="pt">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalhe do Local Histórico - Almada</title>

    <link rel="stylesheet" href="styles.css">
</head>

<body class="pagina-secundaria">

<header>
    <h1 id="titulo-historico">A carregar...</h1>
    <p>Informação detalhada sobre o local histórico.</p>

    <a href="historicos.html" class="voltar-home" style="color:white; text-decoration:none;">
        ← Voltar aos locais históricos
    </a>
</header>

<main>
    <section id="detalhe-historico">
        <p>A carregar informação do local histórico...</p>
    </section>

    <section id="ai-section" class="ai-section" style="display:none;">
        <button id="btn-ai-guia" class="btn-ai" type="button">🤖 Gerar Guia com IA</button>
        <div id="ai-loading" class="ai-loading" style="display:none;">
            <div class="ai-spinner"></div>
            <p>A gerar guia turístico com inteligência artificial...</p>
        </div>
        <div id="ai-resultado" class="ai-resultado"></div>
    </section>
</main>

<div class="audio-widget fechado" id="audio-widget">
    <button id="toggle-widget" class="audio-tab" type="button" aria-expanded="false" aria-controls="audio-panel">
        🎵
    </button>

    <div class="audio-panel" id="audio-panel">
        <p class="audio-title">Música ambiente</p>
        <p id="track-name">A carregar música...</p>

        <button id="play-pause-btn" type="button">▶ Tocar</button>
        <button id="prev-btn" type="button">⏮ Anterior</button>
        <button id="next-btn" type="button">⏭ Próxima</button>

        <label for="volume-control" class="volume-label">Volume</label>
        <input type="range" id="volume-control" min="0" max="1" step="0.1" value="0.3">

        <audio id="bg-audio"></audio>
    </div>
</div>

<script src="script.js"></script>

</body>
</html>
