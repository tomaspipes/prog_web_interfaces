<!DOCTYPE html>
<html lang="pt">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Miradouros - Almada</title>

    <link rel="stylesheet" href="styles.css">
</head>

<body class="pagina-secundaria">

<header>
    <h1>Miradouros de Almada</h1>
    <p>Descubra locais com vistas privilegiadas sobre o Tejo, Lisboa e a frente ribeirinha.</p>

    <a href="index.html" class="voltar-home" style="color:white; text-decoration:none;">
        ← Voltar à página principal
    </a>
</header>

<main>

    <section>
        <h2>Filtros</h2>

        <div class="filtros-praias">
            <button id="filtro-miradouro-acessivel" type="button">
                Só acessíveis
            </button>

            <button id="filtro-miradouro-transportes" type="button">
                Com transportes
            </button>

            <button id="limpar-filtros-miradouros" type="button">
                Limpar filtros
            </button>
        </div>

        <input
                type="text"
                id="pesquisa-miradouro"
                placeholder="Pesquisar miradouro..."
        >
    </section>

    <section>
        <h2>Lista de miradouros</h2>

        <div class="interesses-grid" id="lista-miradouros">
        </div>
    </section>

</main>

<div class="audio-widget fechado" id="audio-widget">
    <button id="toggle-widget" class="audio-tab" type="button" aria-expanded="false" aria-controls="audio-panel">
        🎵
    </button>

    <div class="audio-panel" id="audio-panel">
        <p class="audio-title">Música ambiente</p>
        <p id="track-name">A carregar música...</p>

        <button id="play-pause-btn" type="button">▶ Tocar</button>
        <button id="prev-btn" type="button">⏮ Anterior</button>
        <button id="next-btn" type="button">⏭ Próxima</button>

        <label for="volume-control" class="volume-label">Volume</label>
        <input type="range" id="volume-control" min="0" max="1" step="0.1" value="0.3">

        <audio id="bg-audio"></audio>
    </div>
</div>

<script src="script.js"></script>

</body>
</html>
