<!DOCTYPE html>
<html lang="pt">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Praias - Almada</title>

    <link rel="stylesheet" href="styles.css">
</head>

<body class="pagina-secundaria">

<header>
    <h1>Praias de Almada</h1>
    <p>Descubra as melhores praias, acessos e condições.</p>

    <a href="index.html" class="voltar-home" style="color:white; text-decoration:none;">
        ← Voltar à página principal
    </a>
</header>

<main>

    <!-- Secção de filtros -->
    <section>
        <h2>Filtros</h2>

        <div class="filtros-praias">
            <button id="filtro-acessivel" type="button">
                Só acessíveis
            </button>

            <button id="filtro-estacionamento" type="button">
                Com estacionamento
            </button>

            <button id="filtro-restauracao" type="button">
                Com restauração
            </button>

            <button id="filtro-transportes" type="button">
                Com transportes
            </button>
            
            <button id="limpar-filtros" type="button">
                Limpar filtros
            </button>
        </div>

        <input
                type="text"
                id="pesquisa-praia"
                placeholder="Pesquisar praia..."
        >

    </section>

    <!-- Secção da lista dinâmica de praias -->
    <section>
        <h2>Lista de praias</h2>

        <div class="interesses-grid" id="lista-praias">
            <!-- Os cards das praias vão ser preenchidos via JavaScript -->
        </div>
    </section>

</main>

<!-- Widget de áudio ambiente -->
<div class="audio-widget fechado" id="audio-widget">
    <button id="toggle-widget" class="audio-tab" type="button" aria-expanded="false" aria-controls="audio-panel">
        🎵
    </button>

    <div class="audio-panel" id="audio-panel">
        <p class="audio-title">Música ambiente</p>
        <p id="track-name">A carregar música...</p>

        <button id="play-pause-btn" type="button">▶ Tocar</button>
        <button id="prev-btn" type="button">⏮ Anterior</button>
        <button id="next-btn" type="button">⏭ Próxima</button>

        <label for="volume-control" class="volume-label">Volume</label>
        <input type="range" id="volume-control" min="0" max="1" step="0.1" value="0.3">

        <audio id="bg-audio"></audio>
    </div>
</div>

<script src="script.js"></script>

</body>
</html>
